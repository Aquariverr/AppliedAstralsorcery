modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="appliedas.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="astralsorcery"
type="required"
versionRange="[2.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="ae2"
type="required"
versionRange="[19.2.17,20)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="guideme"
type="required"
versionRange="[21.1.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="observerlib"
type="required"
versionRange="[1.10.3,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="curios"
type="required"
versionRange="[9.5.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="jade"
type="optional"
versionRange="[15.0.0,)"
ordering="AFTER"
side="CLIENT"
