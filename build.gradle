plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            // Keep Java logging and the IDE/Gradle console on the same encoding on Windows.
            systemProperty 'file.encoding', 'UTF-8'
            systemProperty 'stdout.encoding', 'UTF-8'
            systemProperty 'stderr.encoding', 'UTF-8'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'HellFirePvP Maven'
        url = 'https://maven.hellfiredev.net/'
        content {
            includeGroup 'hellfirepvp.astralsorcery'
            includeGroup 'hellfirepvp.observerlib'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Curios Maven'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeModule 'curse.maven', 'ae2-jei-integration-1074338' }
    }
}

// Keep local development mods on the dev runtime classpath without publishing them
// as transitive dependencies of this addon.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Main integrations: compile against Astral Sorcery and AE2's cell/bus implementations,
    // and load their full mods only in the local development game.
    compileOnly "hellfirepvp.astralsorcery:AstralSorcery:${astral_sorcery_version}"
    localRuntime "hellfirepvp.astralsorcery:AstralSorcery:${astral_sorcery_version}"

    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    compileOnly "org.appliedenergistics:guideme:21.1.1"
    localRuntime "org.appliedenergistics:guideme:21.1.1"

    // Runtime requirements of Astral Sorcery, also available for compilation
    // when integration code needs their API types.
    compileOnly "hellfirepvp.observerlib:ObserverLib:${observerlib_version}"
    localRuntime "hellfirepvp.observerlib:ObserverLib:${observerlib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Developer helpers: API jars for compilation and full mods in runClient.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Optional AE2/JEI compatibility mod for local development only.
    localRuntime "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file_id}"

    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
